<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarik Tambang Transformasi</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f3f6fb;color:#1c2733}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bbc;width:100%;margin:4px 0}
button{background:#2563eb;color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:#e5e9f2;color:#1c2733}button.red{background:#dc2626}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk label{display:inline-block;margin:4px 12px 4px 0}.chk input{width:auto;margin-right:4px}
.code{font-size:42px;letter-spacing:8px;font-weight:800;text-align:center;color:#2563eb}
.scores{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.scores .a{color:#2563eb}.scores .b{color:#dc2626}.scores b{font-size:32px}
.track{position:relative;height:60px;margin:8px 0;background:linear-gradient(90deg,#dbeafe 50%,#fee2e2 50%);border-radius:10px;overflow:hidden}
.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #666}
.rope{position:absolute;left:5%;right:5%;top:28px;height:6px;background:#a16207;border-radius:3px}
.flag{position:absolute;top:10px;font-size:30px;transform:translateX(-50%);transition:left .8s;left:50%}
.crew{display:flex;justify-content:space-between;font-size:20px;min-height:26px}
.opt{background:#fff;color:#1c2733;border:2px solid #93a3c4;font-size:18px;text-align:left}
.opt.ok{background:#16a34a;color:#fff;border-color:#16a34a}.opt.no{background:#dc2626;color:#fff;border-color:#dc2626}
#q{font-size:18px;line-height:1.5;margin-bottom:8px}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:8px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;border-bottom:1px solid #e5e9f2;text-align:left}
.tag{font-size:13px;color:#556}
</style>
</head>
<body>
<div class="wrap">
<h1>🪢 Tarik Tambang Transformasi Geometri</h1>

<div id="guru" hidden>
  <div id="setup" class="card">
    <b>Buat sesi baru</b>
    <div class="chk">
      <label><input type="checkbox" class="mt" value="translasi">Translasi</label>
      <label><input type="checkbox" class="mt" value="rotasi">Rotasi (90°, -90°, 180°)</label>
      <label><input type="checkbox" class="mt" value="refleksi">Refleksi</label>
      <label><input type="checkbox" class="mt" value="dilatasi">Dilatasi</label>
      <label><input type="checkbox" class="mt" value="campuran" id="camp"><b>Campuran</b> (semua materi)</label>
    </div>
    <select id="lv"><option value="1">Level 1 (angka kecil)</option><option value="2">Level 2 (sedang)</option><option value="3">Level 3 (sulit)</option></select>
    <button onclick="buat()">Buat Sesi</button>
  </div>
  <div id="ctl" class="card" hidden>
    <div class="tag">Siswa membuka link game ini (tanpa ?guru), lalu memasukkan kode:</div>
    <div class="code" id="gkode"></div>
    <div class="tag" id="ginfo"></div>
    <div id="gwarn" class="warn" hidden></div>
    <div class="row">
      <button id="bMulai" onclick="mulai()">▶ Mulai</button>
      <button id="bStop" class="red" onclick="berhenti()">■ Berhenti</button>
      <button class="sec" onclick="baru()">Sesi Baru</button>
    </div>
    <div id="gtimer" class="tag"></div>
  </div>
</div>

<div id="siswa" hidden>
  <div id="join" class="card">
    <b>Gabung permainan</b>
    <input id="jk" placeholder="Kode sesi (4 huruf)" maxlength="4" style="text-transform:uppercase">
    <input id="jn" placeholder="Nama kamu">
    <div class="row">
      <button onclick="gabung('A')">Masuk Tim A 🔵</button>
      <button class="red" onclick="gabung('B')">Masuk Tim B 🔴</button>
    </div>
  </div>
  <div id="wait" class="card" hidden><b id="wmsg"></b><div class="tag">Menunggu guru menekan Mulai...</div></div>
  <div id="game" class="card" hidden><div id="q"></div><div id="opts"></div><div class="tag" id="my"></div></div>
  <div id="end" class="card" hidden><b id="emsg"></b></div>
</div>

<div id="arena" class="card" hidden>
  <div class="scores"><div class="a">Tim A<br><b id="sa">0</b></div><div class="b" style="text-align:right">Tim B<br><b id="sb">0</b></div></div>
  <div class="track"><div class="rope"></div><div class="flag" id="flag">🚩</div></div>
  <div class="crew"><span id="cA"></span><span id="cB"></span></div>
  <div id="plist" class="tag"></div>
</div>

<div class="card"><b>🏆 Leaderboard</b>
  <div class="tag">Top siswa (akumulasi sesi terakhir)</div><table id="lbTop"></table>
  <div class="tag" style="margin-top:8px">Hasil sesi terakhir</div><table id="lbRiw"></table>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, get, push, runTransaction, query, limitToLast } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZWfSk6aeA_u5QSAu34Mm_ltRd3yaH7X4",
  authDomain: "tarik-tambang-transgeo.firebaseapp.com",
  projectId: "tarik-tambang-transgeo",
  appId: "1:257259079509:web:07125260a60d8f630a91dc",
  databaseURL: "https://tarik-tambang-transgeo-default-rtdb.asia-southeast1.firebasedatabase.app"
};
const app = initializeApp(firebaseConfig), db = getDatabase(app), auth = getAuth(app);
const $ = id => document.getElementById(id);
const GURU = new URLSearchParams(location.search).has('guru');
const LS = { g: k => { try { return localStorage.getItem(k) } catch (e) {} }, s: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k) } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const msg = e => alert(e.message || e);
let uid, kode, D = null, unsub = null;

signInAnonymously(auth).then(c => { uid = c.user.uid; init(); }).catch(e => alert('Login gagal: ' + e.message));

function init() {
  $(GURU ? 'guru' : 'siswa').hidden = false;
  if (GURU) {
    document.querySelectorAll('.mt').forEach(c => c.onchange = () => {
      if (c.checked) document.querySelectorAll('.mt').forEach(o => { if (o !== c && (c.id === 'camp' || o.id === 'camp')) o.checked = false; });
    });
    const k = LS.g('tt_g'); if (k) startGuru(k);
  } else {
    const k = LS.g('tt_s');
    if (k) get(ref(db, `sesi/${k}/pemain/${uid}`)).then(s => { if (s.exists()) startSiswa(k); });
  }
  onValue(query(ref(db, 'riwayat'), limitToLast(40)), s => lb(Object.values(s.val() || {})));
}

/* ---------- tampilan bersama ---------- */
function tally(d) {
  const p = Object.values(d.pemain || {}), f = t => p.filter(x => x.tim === t);
  const sum = t => f(t).reduce((a, x) => a + (x.benar || 0), 0);
  return { p, nA: f('A').length, nB: f('B').length, sA: sum('A'), sB: sum('B') };
}
function draw(d) {
  const t = tally(d); $('arena').hidden = false;
  $('sa').textContent = t.sA; $('sb').textContent = t.sB;
  $('flag').style.left = (50 - 40 * Math.tanh((t.sA - t.sB) / 6)) + '%';
  $('cA').textContent = '🧍'.repeat(t.nA); $('cB').textContent = '🧍'.repeat(t.nB);
  const row = m => t.p.filter(x => x.tim === m).map(x => esc(x.nama) + ' (' + (x.benar || 0) + ')').join(', ') || '-';
  $('plist').innerHTML = '<b>Tim A:</b> ' + row('A') + '<br><b>Tim B:</b> ' + row('B');
  return t;
}
function lb(list) {
  const agg = {};
  list.forEach(r => (r.pemain || []).forEach(p => {
    const k = p.n.toLowerCase(); agg[k] = agg[k] || { n: p.n, b: 0, t: 0 }; agg[k].b += p.b; agg[k].t += p.b + p.s;
  }));
  const top = Object.values(agg).sort((a, b) => b.b - a.b).slice(0, 10);
  $('lbTop').innerHTML = '<tr><th>#</th><th>Nama</th><th>Benar</th><th>Akurasi</th></tr>' + top.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.n)}</td><td>${r.b}</td><td>${r.t ? Math.round(100 * r.b / r.t) : 0}%</td></tr>`).join('');
  $('lbRiw').innerHTML = '<tr><th>Waktu</th><th>Lv</th><th>A</th><th>B</th><th>Menang</th></tr>' + list.slice(-6).reverse().map(r =>
    `<tr><td>${new Date(r.waktu).toLocaleString('id-ID', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${r.level}</td><td>${r.skorA}</td><td>${r.skorB}</td><td>${esc(r.pemenang)}</td></tr>`).join('');
}
function watch(k, cb) {
  if (unsub) unsub(); kode = k;
  unsub = onValue(ref(db, 'sesi/' + k), s => { D = s.val(); if (D) cb(D); });
}

/* ---------- GURU ---------- */
window.buat = async () => {
  const m = [...document.querySelectorAll('.mt:checked')].map(x => x.value);
  if (!m.length) return alert('Pilih minimal satu materi.');
  try {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let k;
    for (;;) { k = ''; for (let i = 0; i < 4; i++) k += abc[ri(0, abc.length - 1)]; if (!(await get(ref(db, 'sesi/' + k))).exists()) break; }
    await set(ref(db, 'sesi/' + k), { status: 'menunggu', materi: m.join(','), level: +$('lv').value, guru: uid });
    LS.s('tt_g', k); startGuru(k);
  } catch (e) { msg(e); }
};
function startGuru(k) {
  $('setup').hidden = true; $('ctl').hidden = false; $('gkode').textContent = k;
  watch(k, d => {
    const t = draw(d);
    $('ginfo').textContent = `Materi: ${d.materi} | Level ${d.level} | Status: ${d.status}`;
    const bad = t.nA !== t.nB || t.nA < 4 || t.nA > 6, w = $('gwarn');
    w.hidden = !(d.status === 'menunggu' && bad);
    w.textContent = `⚠ Tim A: ${t.nA} pemain, Tim B: ${t.nB} pemain. Jumlah harus sama dan 4-6 per tim.`;
    $('bMulai').disabled = d.status !== 'menunggu'; $('bStop').disabled = d.status !== 'main';
    if (d.status === 'selesai') $('gtimer').textContent = 'Pemenang: ' + (d.hasil && d.hasil.pemenang);
  });
  setInterval(() => {
    if (D && D.status === 'main' && D.mulai) { const s = Math.floor((Date.now() - D.mulai) / 1000); $('gtimer').textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  }, 1000);
}
window.mulai = async () => {
  const t = tally(D);
  if ((t.nA !== t.nB || t.nA < 4 || t.nA > 6) && !confirm(`Tim A: ${t.nA}, Tim B: ${t.nB}. Jumlah belum sesuai.\n\nTetap mulai?`)) return;
  try { await set(ref(db, `sesi/${kode}/mulai`), Date.now()); await set(ref(db, `sesi/${kode}/status`), 'main'); } catch (e) { msg(e); }
};
window.berhenti = async () => {
  if (!confirm('Hentikan permainan sekarang?')) return;
  try {
    const t = tally(D), win = t.sA > t.sB ? 'Tim A' : t.sB > t.sA ? 'Tim B' : 'Seri';
    await set(ref(db, `sesi/${kode}/hasil`), { pemenang: win, skorA: t.sA, skorB: t.sB });
    await set(ref(db, `sesi/${kode}/status`), 'selesai');
    await push(ref(db, 'riwayat'), { waktu: Date.now(), kode, level: D.level, materi: D.materi, skorA: t.sA, skorB: t.sB, pemenang: win,
      pemain: t.p.map(x => ({ n: x.nama, b: x.benar || 0, s: x.salah || 0 })) });
  } catch (e) { msg(e); }
};
window.baru = () => { LS.s('tt_g'); location.reload(); };

/* ---------- SISWA ---------- */
window.gabung = async tim => {
  const k = $('jk').value.toUpperCase().trim(), n = $('jn').value.trim().slice(0, 30);
  if (!k || !n) return alert('Isi kode sesi dan nama.');
  try {
    const s = await get(ref(db, 'sesi/' + k));
    if (!s.exists()) return alert('Kode sesi tidak ditemukan.');
    const d = s.val(), p = Object.values(d.pemain || {});
    if (d.status !== 'menunggu') return alert('Sesi sudah dimulai atau selesai.');
    if (p.filter(x => x.tim === tim).length >= 6) return alert('Tim ' + tim + ' sudah penuh (maks 6).');
    if (p.some(x => x.nama.toLowerCase() === n.toLowerCase())) return alert('Nama sudah dipakai, tambahkan inisial.');
    await set(ref(db, `sesi/${k}/pemain/${uid}`), { nama: n, tim, benar: 0, salah: 0 });
    LS.s('tt_s', k); startSiswa(k);
  } catch (e) { msg(e); }
};
let Q = null, lock = false;
const show = id => ['wait', 'game', 'end'].forEach(x => $(x).hidden = x !== id);
function startSiswa(k) {
  $('join').hidden = true;
  watch(k, d => {
    draw(d); const me = (d.pemain || {})[uid] || {};
    if (d.status === 'menunggu') { show('wait'); $('wmsg').textContent = `Kamu di Tim ${me.tim} | Kode ${k}`; }
    else if (d.status === 'main') { show('game'); $('my').textContent = `Skormu: ${me.benar || 0} benar, ${me.salah || 0} salah`; if (!Q) nextQ(); }
    else {
      show('end'); const w = d.hasil && d.hasil.pemenang;
      $('emsg').textContent = (w === 'Seri' ? 'Hasil seri!' : w === 'Tim ' + me.tim ? '🎉 Timmu menang!' : 'Tim lawan menang. Semangat!') + ` Skormu: ${me.benar || 0} benar.`;
    }
  });
}
function nextQ() {
  Q = makeQ(D.materi.split(','), D.level); $('q').textContent = Q.q; $('opts').innerHTML = '';
  Q.o.forEach((t, i) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = String.fromCharCode(65 + i) + '. ' + t; b.onclick = () => pilih(i, b); $('opts').appendChild(b); });
}
function pilih(i, b) {
  if (lock || !D || D.status !== 'main') return; lock = true;
  const ok = i === Q.a; b.classList.add(ok ? 'ok' : 'no');
  if (!ok) $('opts').children[Q.a].classList.add('ok');
  runTransaction(ref(db, `sesi/${kode}/pemain/${uid}/${ok ? 'benar' : 'salah'}`), n => (n || 0) + 1);
  setTimeout(() => { lock = false; if (D.status === 'main') nextQ(); }, 700);
}

/* ---------- Generator soal ---------- */
function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a }
const pick = a => a[ri(0, a.length - 1)], pt = p => `(${p[0]}, ${p[1]})`;
const nz = (a, b) => { let v = 0; while (!v) v = ri(a, b); return v };
const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i);[a[i], a[j]] = [a[j], a[i]] } return a };
function makeQ(materi, L) {
  const R = [4, 8, 12][L - 1];
  const jenis = pick(materi.includes('campuran') ? ['translasi', 'rotasi', 'refleksi', 'dilatasi'] : materi);
  const P = [ri(-R, R), ri(-R, R)]; let q, ans, X = P;
  if (jenis === 'translasi') {
    const T = [ri(-R, R), ri(-R, R)]; ans = [P[0] + T[0], P[1] + T[1]];
    q = `Titik A${pt(P)} ditranslasi oleh T${pt(T)}`;
    if (L === 3) { const T2 = [ri(-R, R), ri(-R, R)]; ans = [ans[0] + T2[0], ans[1] + T2[1]]; q += ` dilanjutkan translasi T${pt(T2)}`; }
  } else if (jenis === 'rotasi') {
    const C = L < 3 ? [0, 0] : [ri(-3, 3), ri(-3, 3)], ang = pick([90, -90, 180]), dx = P[0] - C[0], dy = P[1] - C[1];
    const r = ang === 90 ? [-dy, dx] : ang === -90 ? [dy, -dx] : [-dx, -dy]; ans = [C[0] + r[0], C[1] + r[1]];
    q = `Titik A${pt(P)} dirotasi sejauh ${ang === 90 ? '90° (positif, berlawanan arah jarum jam)' : ang === -90 ? '-90° (negatif, searah jarum jam)' : '180°'} dengan pusat ${L < 3 ? 'O(0, 0)' : 'titik ' + pt(C)}`;
  } else if (jenis === 'refleksi') {
    const h = nz(-[3, 5, 8][L - 1], [3, 5, 8][L - 1]), x = P[0], y = P[1];
    const M = pick([['sumbu X', [x, -y]], ['sumbu Y', [-x, y]], ['titik asal O(0, 0)', [-x, -y]], ['garis y = x', [y, x]], ['garis y = -x', [-y, -x]], ['garis x = ' + h, [2 * h - x, y]], ['garis y = ' + h, [x, 2 * h - y]]]);
    ans = M[1]; q = `Titik A${pt(P)} direfleksikan (dicerminkan) terhadap ${M[0]}`;
  } else {
    const C = L < 3 ? [0, 0] : [ri(-3, 3), ri(-3, 3)], k = pick([[2, 3], [2, 3, -1, -2], [2, 3, -2, -3, 0.5]][L - 1]);
    if (k === 0.5) { const m = Math.floor(R / 2); X = [C[0] + 2 * ri(-m, m), C[1] + 2 * ri(-m, m)]; }
    ans = [C[0] + k * (X[0] - C[0]), C[1] + k * (X[1] - C[1])];
    q = `Titik A${pt(X)} didilatasi dengan pusat ${L < 3 ? 'O(0, 0)' : pt(C)} dan faktor skala ${k === 0.5 ? '1/2' : k}`;
  }
  q += '. Koordinat bayangan titik A adalah ...';
  const key = a => a[0] + ',' + a[1], ax = ans[0], ay = ans[1], seen = { [key(ans)]: 1 }, d = [];
  shuf([[-ax, ay], [ax, -ay], [ay, ax], [-ax, -ay], [ax + 1, ay], [ax, ay + 1], [ax - 1, ay], [ax, ay - 1], [X[0], X[1]]])
    .forEach(c => { if (!seen[key(c)] && d.length < 3) { seen[key(c)] = 1; d.push(c) } });
  while (d.length < 3) { const c = [ax + ri(-3, 3), ay + ri(-3, 3)]; if (!seen[key(c)]) { seen[key(c)] = 1; d.push(c) } }
  const all = shuf([ans].concat(d));
  return { q, o: all.map(pt), a: all.indexOf(ans) };
}
</script>
</body>
</html>
